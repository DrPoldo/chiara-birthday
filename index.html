    * {
      box-sizing: border-box;

    }

    html,
    body {
      width: 100%;

      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .section {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding: 40px 20px;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color: white;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .top {
      width: 100%;
      text-align: center;
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
      align-items: center;
    }

    .answer {
      width: 280px;
      padding: 15px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(5px);

      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .answer:hover {
      background: rgba(255,255,255,0.25);
    }

    .answer.selected {
      border-color: #4da3ff;
      background: rgba(77,163,255,0.35);
    }

    .bottom {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .back-btn {
      background: #cccccc;
      color: black;
    }

    .next-btn {
      background: #007bff;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }
@media (max-width: 768px) {

  html,
  body {

    overflow-x: hidden;
  }

  .section {

    let currentSectionId = "intro";

    const historyStack = [];


    /*
      ==================================================
      HELPERS
      ==================================================
    */

    function getSectionById(id) {

      return sectionsData.find(section => section.id === id);

    }


    /*
      ==================================================
      RENDER
      ==================================================
    */

    function renderSection(sectionId) {

      const data = getSectionById(sectionId);

      const app = document.getElementById("app");

      app.innerHTML = `

        <section
          class="section"
          style="background-image:url('${data.background}')"
        >

          <div class="overlay"></div>

          <div class="content" data-next="${data.next || ""}">

            <div class="top">

              <div class="title">
                ${data.title}
              </div>

              ${
                data.answers && data.answers.length
                  ? `
                    <div class="answers">

                      ${data.answers.map(answer => `

                        <div
                          class="answer"
                          data-next="${answer.next || ""}"
                        >
                          ${answer.text}
                        </div>

                      `).join("")}

                    </div>
                  `
                  : ""
              }

            </div>

            <div class="bottom">

              ${
                historyStack.length > 0
                  ? `
                    <button class="back-btn">
                      Back
                    </button>
                  `
                  : ""
              }

              ${
                data.next || (data.answers && data.answers.length > 0)
                  ? `
                    <button class="next-btn">
                      Next
                    </button>
                  `
                  : ""
              }

            </div>

          </div>

        </section>
      `;

      attachEvents();

    }


    /*
      ==================================================
      EVENTS
      ==================================================
    */

    function attachEvents() {

      /*
        ANSWER SELECTION
      */

      document
        .querySelectorAll(".answer")
        .forEach(answer => {

          answer.addEventListener("click", () => {

            document
              .querySelectorAll(".answer")
              .forEach(a => {
                a.classList.remove("selected");
              });

            answer.classList.add("selected");

          });

        });


      /*
        NEXT BUTTON
      */

      const nextBtn = document.querySelector(".next-btn");

      if (nextBtn) {

        nextBtn.addEventListener("click", () => {

          let selected = document.querySelector(".answer.selected");

          /*
            Require selection
          */

          if (!selected) {
            selected = document.querySelector(".content");
          }

          const nextSectionId = selected.dataset.next;

          if (!nextSectionId) {

            alert("Select an answer");

            return;

          }

          historyStack.push(currentSectionId);

          currentSectionId = nextSectionId;

          renderSection(currentSectionId);

        });

      }


      /*
        BACK BUTTON
      */

      const backBtn = document.querySelector(".back-btn");

      if (backBtn) {

        backBtn.addEventListener("click", () => {

          if (historyStack.length === 0) {
            return;
          }

          currentSectionId = historyStack.pop();

          renderSection(currentSectionId);

        });

      }

    }
